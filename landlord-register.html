<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Landlord Registration - BoardingPay</title>

    <link
        rel="stylesheet"
        href="./style.css?v=20">

    <style>

        /* =========================================
           VALIDATION MESSAGE
        ========================================== */

        .field-error {
            display: none;
            margin-top: 6px;
            font-size: 13px;
            color: #d93025;
            font-weight: 600;
        }

        .field-error.show {
            display: block;
        }

        .input-error {
            border: 1.5px solid #d93025 !important;
            outline: none;
        }

        /* =========================================
           REGISTRATION MESSAGE
        ========================================== */

        .registration-message {
            display: none;
            margin-top: 12px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            font-weight: 600;
        }

        .registration-message.show {
            display: block;
        }

        .registration-message.error {
            background: #ffeaea;
            color: #c62828;
        }

        /* =========================================
           DISABLED BUTTON
        ========================================== */

        .register-submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }


        /* =========================================
           BLUE MOBILE-FRIENDLY REGISTRATION DESIGN
        ========================================== */
        .registration-page {
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(180deg, #eef7ff 0%, #ffffff 38%, #ffffff 100%);
        }

        .registration-header {
            background: linear-gradient(135deg, #0d8bdc, #1677c8);
            color: #ffffff;
            border-bottom: 3px solid #0b6fb8;
            box-shadow: 0 4px 14px rgba(13, 139, 220, 0.18);
        }

        .registration-header .header-title h1,
        .registration-header .header-title p,
        .registration-header .back-btn {
            color: #ffffff;
        }

        .registration-form {
            width: min(94%, 760px);
            max-width: 760px;
            margin: 22px auto 0;
            padding: 32px 26px 46px;
            background: #ffffff;
            border: 1px solid #cfe7f8;
            border-top: 5px solid #168bd2;
            border-radius: 16px;
            box-shadow: 0 8px 28px rgba(18, 116, 175, 0.12);
            box-sizing: border-box;
        }

        .registration-form .form-group {
            width: 100%;
            margin-bottom: 21px;
        }

        .registration-form .form-group label {
            color: #064f86;
            font-weight: 700;
        }

        .registration-form .form-group input {
            width: 100%;
            min-height: 60px;
            padding: 0 16px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #bddcf2;
            background: #fbfdff;
            color: #123b5d;
            box-sizing: border-box;
            transition: border-color .2s, box-shadow .2s, background .2s;
        }

        .registration-form .form-group input:focus {
            outline: none;
            border-color: #168bd2;
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(22, 139, 210, 0.12);
        }

        .registration-form .form-group input::placeholder {
            color: #8aa4b8;
        }

        .registration-form .password-wrapper {
            width: 100%;
            position: relative;
        }

        .registration-form .password-wrapper input {
            width: 100%;
            min-height: 60px;
            padding-right: 54px;
        }

        /* Eye stays INSIDE the password field */
        .registration-form .password-wrapper .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 36px;
            height: 36px;
            min-width: 36px;
            padding: 0;
            margin: 0;
            border: 0;
            background: transparent;
            color: #5f7f96;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            border-radius: 50%;
        }

        .registration-form .password-wrapper .password-toggle:hover {
            color: #168bd2;
            background: #eaf6ff;
        }

        .register-submit-btn {
            width: 100%;
            min-height: 60px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            background: linear-gradient(135deg, #168bd2, #0878c1);
            border: none;
            color: #ffffff;
            box-shadow: 0 5px 14px rgba(22, 139, 210, 0.20);
            cursor: pointer;
        }

        .register-submit-btn:hover {
            background: linear-gradient(135deg, #087fc8, #066cae);
        }

        .field-error {
            color: #d93025;
        }

        .input-error {
            border-color: #d93025 !important;
        }

        @media (max-width: 600px) {
            .registration-form {
                width: calc(100% - 20px);
                max-width: none;
                margin-top: 16px;
                padding: 28px 18px 40px;
                border-radius: 14px;
            }

            .registration-form .form-group {
                margin-bottom: 22px;
            }

            .registration-form .form-group input,
            .registration-form .password-wrapper input,
            .register-submit-btn {
                min-height: 62px;
                font-size: 16px;
            }

            .registration-form .password-wrapper .password-toggle {
                right: 10px;
                width: 36px;
                height: 36px;
            }
        }

    </style>

</head>


<body>


<main class="app registration-page">


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="registration-header">

        <button
            type="button"
            id="landlordBackBtn"
            class="back-btn"
            aria-label="Back">

            ‹

        </button>


        <div class="header-title">

            <h1>Create Landlord Account</h1>

            <p>Enter your information</p>

        </div>

    </header>



    <!-- =========================================
         LANDLORD REGISTRATION FORM
    ========================================== -->

    <form
        id="landlordRegistrationForm"
        class="registration-form">


        <!-- =====================================
             FULL NAME
        ====================================== -->

        <div class="form-group">

            <label for="landlordName">
                Full Name
            </label>

            <input
                type="text"
                id="landlordName"
                name="fullName"
                placeholder="Enter your full name"
                autocomplete="name"
                required>

        </div>



        <!-- =====================================
             EMAIL
        ====================================== -->

        <div class="form-group">

            <label for="landlordEmail">
                Email Address
            </label>

            <input
                type="email"
                id="landlordEmail"
                name="email"
                placeholder="Enter your email"
                autocomplete="email"
                required>

        </div>



        <!-- =====================================
             PASSWORD
        ====================================== -->

        <div class="form-group">

            <label for="landlordPassword">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="landlordPassword"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required>

                <button
                    type="button"
                    class="password-toggle"
                    data-target="landlordPassword"
                    aria-label="Show password">

                    👁

                </button>

            </div>

        </div>



        <!-- =====================================
             CONFIRM PASSWORD
        ====================================== -->

        <div class="form-group">

            <label for="landlordConfirmPassword">
                Confirm Password
            </label>

            <div class="password-wrapper">

                <input
                    type="password"
                    id="landlordConfirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required>

                <button
                    type="button"
                    class="password-toggle"
                    data-target="landlordConfirmPassword"
                    aria-label="Show password">

                    👁

                </button>

            </div>

        </div>



        <!-- =====================================
             ERROR MESSAGE
        ====================================== -->

        <div
            class="registration-message error"
            id="registrationError">
        </div>



        <!-- =====================================
             CREATE ACCOUNT BUTTON
        ====================================== -->

        <button
            type="submit"
            id="landlordRegisterBtn"
            class="register-submit-btn">

            Create Account

        </button>


    </form>


</main>



<script>

/* =========================================================
   LANDLORD REGISTRATION
   =========================================================

   FLOW:

   Landlord Register
        ↓
   Save account
        ↓
   login.html
        ↓
   Login as Landlord
        ↓
   landlord-dashboard.html

========================================================= */


document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =====================================================
           GET ELEMENTS
        ===================================================== */

        const form =
            document.getElementById(
                "landlordRegistrationForm"
            );

        const nameInput =
            document.getElementById(
                "landlordName"
            );

        const emailInput =
            document.getElementById(
                "landlordEmail"
            );

        const passwordInput =
            document.getElementById(
                "landlordPassword"
            );

        const confirmPasswordInput =
            document.getElementById(
                "landlordConfirmPassword"
            );

        const registerBtn =
            document.getElementById(
                "landlordRegisterBtn"
            );

        const backBtn =
            document.getElementById(
                "landlordBackBtn"
            );

        const registrationError =
            document.getElementById(
                "registrationError"
            );



        /* =====================================================
           PASSWORD SHOW / HIDE
        ===================================================== */

        document
            .querySelectorAll(".password-toggle")
            .forEach(
                function (button) {

                    button.addEventListener(
                        "click",
                        function () {

                            const targetId =
                                button.getAttribute(
                                    "data-target"
                                );

                            const target =
                                document.getElementById(
                                    targetId
                                );


                            if (!target) {
                                return;
                            }


                            if (
                                target.type ===
                                "password"
                            ) {

                                target.type =
                                    "text";

                                button.textContent =
                                    "🙈";

                                button.setAttribute(
                                    "aria-label",
                                    "Hide password"
                                );

                            }

                            else {

                                target.type =
                                    "password";

                                button.textContent =
                                    "👁";

                                button.setAttribute(
                                    "aria-label",
                                    "Show password"
                                );

                            }

                        }
                    );

                }
            );



        /* =====================================================
           PASSWORD MATCH VALIDATION
        ===================================================== */

        function validatePasswordMatch() {

            const password =
                passwordInput.value;

            const confirmPassword =
                confirmPasswordInput.value;


            if (
                confirmPassword !== "" &&
                password !== confirmPassword
            ) {

                confirmPasswordInput.setCustomValidity(
                    "Passwords do not match."
                );

                return false;

            }


            confirmPasswordInput.setCustomValidity("");

            return true;

        }



        /* =====================================================
           PASSWORD INPUT EVENTS
        ===================================================== */

        passwordInput.addEventListener(
            "input",
            function () {

                confirmPasswordInput.setCustomValidity("");

            }
        );


        confirmPasswordInput.addEventListener(
            "input",
            function () {

                validatePasswordMatch();

            }
        );



        /* =====================================================
           FORM SUBMIT
        ===================================================== */

        form.addEventListener(
            "submit",
            function (event) {

                event.preventDefault();


                /* =============================================
                   CLEAR ERROR
                ============================================= */

                registrationError.textContent = "";

                registrationError.classList.remove(
                    "show"
                );



                /* =============================================
                   CHECK FORM
                ============================================= */

                if (!form.checkValidity()) {

                    form.reportValidity();

                    return;

                }



                /* =============================================
                   CHECK PASSWORD MATCH
                ============================================= */

                if (!validatePasswordMatch()) {

                    confirmPasswordInput.reportValidity();

                    confirmPasswordInput.focus();

                    return;

                }



                /* =============================================
                   GET USER DATA
                ============================================= */

                const fullName =
                    nameInput.value.trim();

                const email =
                    emailInput.value
                        .trim()
                        .toLowerCase();

                const password =
                    passwordInput.value;



                /* =============================================
                   GET EXISTING ACCOUNTS
                ============================================= */

                let accounts = [];

                try {

                    accounts =
                        JSON.parse(
                            localStorage.getItem(
                                "boardingPayAccounts"
                            ) || "[]"
                        );


                    if (
                        !Array.isArray(accounts)
                    ) {

                        accounts = [];

                    }

                }

                catch (error) {

                    accounts = [];

                }



                /* =============================================
                   CHECK DUPLICATE EMAIL
                ============================================= */

                const emailExists =
                    accounts.some(
                        function (account) {

                            const existingEmail =
                                String(
                                    account.email ||
                                    account.identifier ||
                                    ""
                                )
                                .trim()
                                .toLowerCase();


                            return (
                                existingEmail ===
                                email
                            );

                        }
                    );


                if (emailExists) {

                    registrationError.textContent =
                        "This email is already registered.";

                    registrationError.classList.add(
                        "show"
                    );

                    emailInput.focus();

                    return;

                }



                /* =============================================
                   CREATE LANDLORD ACCOUNT
                ============================================= */

                const landlordData = {

                    id:
                        "LANDLORD-" +
                        Date.now(),

                    fullName:
                        fullName,

                    email:
                        email,

                    identifier:
                        email,

                    password:
                        password,

                    role:
                        "landlord",

                    accountType:
                        "Landlord",

                    createdAt:
                        new Date().toISOString()

                };



                /* =============================================
                   SAVE TO COMMON ACCOUNTS
                ============================================= */

                accounts.push(
                    landlordData
                );


                localStorage.setItem(
                    "boardingPayAccounts",
                    JSON.stringify(accounts)
                );



                /* =============================================
                   SAVE CURRENT LANDLORD
                   FOR LANDLORD DASHBOARD
                ============================================= */

                localStorage.setItem(
                    "currentLandlord",
                    JSON.stringify(landlordData)
                );



                /* =============================================
                   SAVE LANDLORD LIST
                ============================================= */

                let landlords = [];

                try {

                    landlords =
                        JSON.parse(
                            localStorage.getItem(
                                "boardingPay_landlords"
                            ) || "[]"
                        );


                    if (
                        !Array.isArray(
                            landlords
                        )
                    ) {

                        landlords = [];

                    }

                }

                catch (error) {

                    landlords = [];

                }


                landlords.push({

                    id:
                        landlordData.id,

                    name:
                        landlordData.fullName,

                    fullName:
                        landlordData.fullName,

                    email:
                        landlordData.email,

                    accountType:
                        "Landlord",

                    role:
                        "landlord",

                    createdAt:
                        landlordData.createdAt

                });


                localStorage.setItem(
                    "boardingPay_landlords",
                    JSON.stringify(landlords)
                );



                /* =============================================
                   ADMIN NOTIFICATION
                ============================================= */

                let notifications = [];

                try {

                    notifications =
                        JSON.parse(
                            localStorage.getItem(
                                "adminNotifications"
                            ) || "[]"
                        );


                    if (
                        !Array.isArray(
                            notifications
                        )
                    ) {

                        notifications = [];

                    }

                }

                catch (error) {

                    notifications = [];

                }


                notifications.unshift({

                    id:
                        "NOTIF-" +
                        Date.now(),

                    title:
                        "New Landlord Registration",

                    message:
                        landlordData.fullName +
                        " created a new landlord account.",

                    icon:
                        "🏠",

                    time:
                        new Date().toLocaleString(),

                    read:
                        false

                });


                localStorage.setItem(
                    "adminNotifications",
                    JSON.stringify(notifications)
                );



                /* =============================================
                   ADMIN ACTIVITY
                ============================================= */

                let activities = [];

                try {

                    activities =
                        JSON.parse(
                            localStorage.getItem(
                                "boardingPay_activities"
                            ) || "[]"
                        );


                    if (
                        !Array.isArray(
                            activities
                        )
                    ) {

                        activities = [];

                    }

                }

                catch (error) {

                    activities = [];

                }


                activities.unshift({

                    id:
                        "ACT-" +
                        Date.now(),

                    title:
                        "New Landlord Account",

                    message:
                        landlordData.fullName +
                        " registered as a landlord.",

                    icon:
                        "🏠",

                    date:
                        new Date().toLocaleString()

                });


                localStorage.setItem(
                    "boardingPay_activities",
                    JSON.stringify(activities)
                );



                /* =============================================
                   SAVE LOGIN PREFILL
                   PARA PAGDATING SA LOGIN PAGE,
                   ALREADY SELECTED ANG LANDLORD
                ============================================= */

                localStorage.setItem(
                    "pendingLoginRole",
                    "landlord"
                );

                localStorage.setItem(
                    "pendingLoginIdentifier",
                    email
                );



                /* =============================================
                   BUTTON STATE
                ============================================= */

                registerBtn.disabled = true;

                registerBtn.textContent =
                    "Account Created!";



                /* =============================================
                   GO TO LOGIN PAGE
                ============================================= */

                setTimeout(
                    function () {

                        window.location.href =
                            "login.html";

                    },
                    500
                );

            }
        );



        /* =====================================================
           BACK BUTTON
           DIRECT TO LOGIN.HTML
        ===================================================== */

        if (backBtn) {

            backBtn.addEventListener(
                "click",
                function () {

                    window.location.href =
                        "create-account.html";

                }
            );

        }


    }
);

</script>


</body>

</html>
